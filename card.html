<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동네 주민등록증 - 어슬렁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="top"></header>
  <main><section id="content"></section></main>
  <footer>데이터: 소상공인시장진흥공단 상가(상권)정보 API (공공데이터포털)</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="common.js"></script>
  <script>
    renderHeader('');
    const q = getParams();
    const box = document.getElementById('content');
    if (!q.lat) location.replace('index.html');
    loading(box, '동네 주민센터에서 주민등록증을 만드는 중… 🪪');

    (async () => {
      try {
        const [d, presets] = await Promise.all([
          api({ action: 'analyze', lat: q.lat, lon: q.lon, r: 300 }),
          getPresets(),
        ]);
        const R = report(d, presets, q.name);
        const info = await issueNo(R);
        render(d, R, info);
      } catch (err) {
        box.innerHTML = '';
        showError(err);
      }
    })();

    // 같은 동네는 한 번만 발급 (발급번호는 브라우저에 기억, 발급 기록은 스프레드시트에 저장)
    async function issueNo(R) {
      const key = 'card_' + q.lat.toFixed(4) + '_' + q.lon.toFixed(4);
      try {
        const saved = localStorage.getItem(key);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      const res = await api({ action: 'issue', dong: R.name, mbti: R.mbti.code, age: R.age });
      const info = { no: res.no, total: res.total, date: new Date().toLocaleDateString('ko-KR') };
      try { localStorage.setItem(key, JSON.stringify(info)); } catch (e) {}
      return info;
    }

    // 증명사진: 가게 구성 비율만큼 아이콘 16칸 채우기
    function photoIcons(g) {
      const keys = Object.keys(GROUPS);
      const total = keys.reduce((a, k) => a + g[k], 0) || 1;
      const raw = keys.map(k => g[k] / total * 16);
      const cnt = raw.map(Math.floor);
      const left = 16 - cnt.reduce((a, b) => a + b, 0);
      raw.map((v, i) => [v - cnt[i], i]).sort((a, b) => b[0] - a[0]).slice(0, left).forEach(([, i]) => cnt[i]++);
      const icons = [];
      keys.forEach((k, i) => { for (let j = 0; j < cnt[i]; j++) icons.push(GROUPS[k].icon); });
      return icons.map(x => `<span>${x}</span>`).join('');
    }

    function render(d, R, info) {
      const top = R.similar[0];
      const dongUrl = new URL(link('dong.html', q.lat, q.lon, R.name), location.href).href;
      document.title = `${R.name} 주민등록증 - 어슬렁`;

      box.innerHTML = `
      <div class="card" style="text-align:center">
        <h2>🪪 ${esc(R.name)} 주민등록증이 발급됐어요!</h2>
        <p class="hint">어슬렁에서 발급된 <b>${info.total}번째</b> 동네 주민등록증이에요.</p>
      </div>

      <div id="idcard" class="idcard">
        <div class="head">동 네 주 민 등 록 증</div>
        <div class="body">
          <div class="photo">${photoIcons(d.groups)}</div>
          <table>
            <tr><th>이름</th><td>${esc(R.name)}</td></tr>
            <tr><th>주소</th><td>${esc(R.place)}</td></tr>
            <tr><th>나이</th><td>만 ${R.age}세 ${ageLabel(R.age).split(' ')[0]}</td></tr>
            <tr><th>성격</th><td>${R.mbti.code} · ${esc(R.mbti.name)}</td></tr>
            <tr><th>특기</th><td>${esc(R.specialty)}</td></tr>
            <tr><th>혼놀 지수</th><td class="stars">${starText(R.honol)}</td></tr>
            <tr><th>노포 지수</th><td class="stars">${starText(R.nopo)}</td></tr>
            <tr><th>닮은 동네</th><td>${top ? esc(top.p.name) + ' (' + top.score + '%)' : '-'}</td></tr>
          </table>
        </div>
        <div class="foot">
          <div>발급번호 ${info.no}<br>${info.date}<br>어슬렁 동장 <span class="stamp">어슬렁</span></div>
          <div id="qr"></div>
        </div>
      </div>

      <div class="row" style="justify-content:center;margin-top:18px">
        <button id="save" class="btn">💾 이미지로 저장</button>
        <a class="btn ghost" href="${link('dong.html', q.lat, q.lon, R.name)}">📊 분석 다시 보기</a>
      </div>
      <p class="hint" style="text-align:center">📱 QR을 핸드폰 카메라로 찍으면 이 동네 분석 페이지가 열려요.</p>`;

      // QR 코드: 이 동네 분석 페이지 주소
      new QRCode(document.getElementById('qr'), { text: dongUrl, width: 128, height: 128, correctLevel: QRCode.CorrectLevel.M });

      // 카드를 PNG 이미지로 저장
      document.getElementById('save').onclick = () => {
        html2canvas(document.getElementById('idcard'), { scale: 2, backgroundColor: null }).then(canvas => {
          const a = document.createElement('a');
          a.download = `어슬렁_${R.name}_주민등록증.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        });
      };
    }
  </script>
</body>
</html>
