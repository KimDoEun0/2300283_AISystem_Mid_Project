<!DOCTYPE html>

<body>

  <script>
    renderHeader('');
    const q = getParams();
    const box = document.getElementById('content');
    if (!q.lat) location.replace('index.html');
    loading(box, '반경 300m이에요… 🐾<br><small>처음보는 동네는 5초쯤 걸려요</small>');

    (async () => {
      try {
        const d = await api({ action: 'analyze', lat: q.lat, lon: q.lon, r: 300 });
        // 방금 분석한 동네어서 목록을 새로 받는다
        const presets = await getPresets(true);
        render(d, presets);
      } catch (err) {
        box.innerHTML = '';
        showError(err);
      }
    })();

      if (d.total < 10) {
        box.innerHTML = `<div class="card"><h2>🌾 이 근처엔 가게가 거의 없어요</h2>

          <a class="btn" hr 르기</a></div>`;

      const R = report(d, presets, q.name);

          <a class="btn green" href="${link('similar.html', q.lat, q.lon,
R.name)}">🔍 이 동네랑 닮은
        </div>
      </div>

      <div class="two">
        <div class="card">
          <h2>🧬 동네 MBTI<
          <div class="mbti-code">${R.mbti.code}</div>

          ${R.mbti.axes.map
            <div class="axis">
              <div class="e}</span><span>${a.r[1]}${a.r[0]}</span></div>

        <div class="card">

      </div>

      // 가게 지도
