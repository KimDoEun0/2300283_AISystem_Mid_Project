<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혼밥 도전 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="card">
    <div id="level"></div>
    <div id="next"></div>
    <div id="trip" hidden>
      <form class="search" id="tf" style="margin-top:12px">
        <input id="tq" type="search" autocomplete="off"
          placeholder="어디로 원정 갈까요? (예: 성수역)">
        <button class="btn-sm" type="submit">찾기</button>
      </form>
      <div id="tres"></div>
    </div>
  </section>

  <section class="card" id="towns"></section>
  <section class="card" id="records"></section>

  <div class="reset"><button id="reset">기록 모두 지우기</button></div>
</main>

<script src="common.js"></script>
<script>
renderNav('my.html');

// ---------- 레벨 진행 (9개 원) ----------
function renderTrack() {
  const t = getTried();
  const lv = myLevel();
  let track = '';
  for (let i = 1; i <= 9; i++) {
    if (i > 1) track += '<div class="line"></div>';
    track += '<div class="dot' + (t[i] ? ' done' : '') +
      '" title="' + lvTitle(i) + '"><span>' +
      LEVELS[i].emoji + '</span></div>';
  }
  const testLink = hasTested() ? '' :
    '<a class="btn btn-gray" href="test.html" ' +
    'style="margin-bottom:12px">레벨 테스트 하러 가기</a>';
  $('level').innerHTML =
    '<p class="sub">내 혼밥 레벨</p>' +
    '<div class="big">' + LEVELS[lv].emoji + ' ' + lvTitle(lv) + '</div>' +
    '<div class="track">' + track + '</div>' + testLink;
}

// ---------- 다음 도전 한 줄 제안 ----------
async function renderNext() {
  const box = $('next');
  const nx = nextLevel();
  if (!nx) {
    box.innerHTML =
      '<div class="gray-box" style="text-align:center">' +
      '<div class="emo emo-big">\u{1F451}</div>' +
      '<b>혼밥 마스터 달성!</b>' +
      '<p class="sub">모든 레벨을 정복했어요. 정말 대단해요!</p></div>';
    return;
  }
  const first = triedCount() === 0;
  const ask = (first ? '첫 도전으로 ' : '다음엔 ') +
    lvTitle(nx) + ' 어때요?';

  let target = store.get('target', null);
  if (target && (target.lv !== nx || findLog(target.id))) {
    target = null;
    store.del('target');
  }

  let msg = '';
  if (!target) {
    const last = store.get('lastLoc', null);
    if (!last) {
      msg = '지도에서 위치를 먼저 정하면 가까운 식당을 골라 드려요';
    } else {
      box.innerHTML = '<p class="sub">주변에서 Lv.' + nx +
        ' 식당을 찾고 있어요…</p>';
      try {
        const d = await loadStores(last.lat, last.lng);
        const s = d.list.find(x => x.lv === nx);
        if (s) {
          target = s;
          store.set('target', target);
        } else {
          msg = last.label + ' 주변 500m에 Lv.' + nx +
            ' 식당이 없어요. 원정을 떠나 볼까요?';
        }
      } catch (e) {
        msg = '정보를 불러오지 못했어요 (' + e.message + ')';
      }
    }
  }

  let h = '<p class="next-line">' + esc(ask);
  if (target) {
    h += ' · <a href="' + storeUrl(target) + '"><b>' +
      esc(target.name) + '</b> ' + fmtDist(target.dist) +
      ' \u{203A}</a>';
  }
  h += '</p>';
  if (msg) {
    h += '<p class="sub" style="margin-bottom:12px">' + esc(msg) + '</p>';
  }
  if (target) {
    h += '<a class="btn btn-primary" href="' + storeUrl(target) + '">' +
      '지도에서 보기</a>' +
      '<p class="sub" style="text-align:center;margin:6px 0 10px">' +
      '다녀온 뒤 지도에서 "여기서 혼밥했어요"를 눌러 주세요</p>';
  }
  h += '<button class="btn btn-gray" id="tripBtn">' +
    '\u{1F9ED} 원정 떠나기</button>';
  box.innerHTML = h;

  $('tripBtn').onclick = () => {
    $('trip').hidden = !$('trip').hidden;
    if (!$('trip').hidden) $('tq').focus();
  };
}

// ---------- 혼밥 원정 ----------
$('tf').onsubmit = async e => {
  e.preventDefault();
  const q = $('tq').value.trim();
  if (!q) return;
  $('tres').innerHTML = '<p class="sub">찾고 있어요…</p>';
  try {
    const rs = await api({ action: 'search', query: q });
    if (!rs.length) {
      $('tres').innerHTML = '<p class="sub">검색 결과가 없어요</p>';
      return;
    }
    $('tres').innerHTML = rs.map((r, i) =>
      '<button class="result" data-i="' + i + '"><b>' +
      esc(r.name) + '</b><span class="sub">' + esc(r.addr) +
      '</span></button>').join('');
    $('tres').querySelectorAll('.result').forEach(b => {
      b.onclick = () => goTrip(rs[b.dataset.i]);
    });
  } catch (err) {
    $('tres').innerHTML = '<p class="sub">' + esc(err.message) + '</p>';
  }
};

async function goTrip(r) {
  const nx = nextLevel();
  $('tres').innerHTML = '<p class="sub">' + esc(r.name) +
    ' 주변에서 Lv.' + nx + ' 식당을 찾고 있어요…</p>';
  try {
    const d = await loadStores(r.lat, r.lng);
    const s = d.list.find(x => x.lv === nx && !findLog(x.id));
    if (!s) {
      $('tres').innerHTML = '<p class="sub">' + esc(r.name) +
        ' 주변에도 Lv.' + nx + ' 식당이 없어요. 다른 곳을 찾아보세요</p>';
      return;
    }
    store.set('target', s);
    $('trip').hidden = true;
    $('tq').value = '';
    $('tres').innerHTML = '';
    toast(r.name + '(으)로 원정 목적지를 정했어요');
    renderNext();
  } catch (err) {
    $('tres').innerHTML = '<p class="sub">' + esc(err.message) + '</p>';
  }
}

// ---------- 동네 정복 ----------
function renderTowns() {
  const towns = {};
  getLog().forEach(r => {
    if (r.code) towns[r.code] = r.dong;
  });
  const names = Object.keys(towns).map(k => towns[k]);
  let h = '<div class="card-title">정복한 동네 ' +
    '<span class="num">' + names.length + '곳</span></div>';
  if (names.length) {
    h += '<div class="chips town-chips">' + names.map(n =>
      '<span class="chip on">\u{1F6A9} ' + esc(n) + '</span>'
    ).join('') + '</div>';
  } else {
    h += '<p class="sub">혼밥 기록을 남기면 그 동네가 여기에 쌓여요</p>';
  }
  $('towns').innerHTML = h;
}

// ---------- 최근 도전 기록 ----------
function renderRecords() {
  const log = getLog();
  let h = '<div class="card-title">최근 도전 기록 ' +
    '<span class="num">' + log.length + '곳</span></div>';
  if (!log.length) {
    h += '<p class="sub">아직 기록이 없어요. ' +
      '지도에서 식당을 누르고 "여기서 혼밥했어요"를 눌러 보세요!</p>';
  } else {
    h += '<ul class="list">' + log.map((r, i) =>
      '<li class="item" data-i="' + i + '"><div class="emo">' +
      LEVELS[r.lv].emoji + '</div><div class="item-main">' +
      '<div class="item-name">' + esc(r.name) + '</div>' +
      '<div class="sub">' + lvBadge(r.lv) + ' ' +
      esc(LEVELS[r.lv].label) +
      (r.dong ? ' · ' + esc(r.dong) : '') +
      ' · ' + shortDate(r.date) + '</div></div>' +
      '<button class="rec-x" data-x="' + i + '">취소</button></li>'
    ).join('') + '</ul>';
  }
  $('records').innerHTML = h;
}

$('records').onclick = e => {
  const log = getLog();
  const x = e.target.closest('[data-x]');
  if (x) {
    const r = log[Number(x.dataset.x)];
    if (!confirm(r.name + ' 기록을 취소할까요?')) return;
    removeLog(r.id);
    renderAll();
    toast('기록을 취소했어요');
    return;
  }
  const li = e.target.closest('[data-i]');
  if (li) location.href = storeUrl(log[Number(li.dataset.i)]);
};

// ---------- 초기화 ----------
$('reset').onclick = () => {
  if (!confirm('테스트 결과와 도전 기록을 모두 지울까요?')) return;
  store.del('answers');
  store.del('log');
  store.del('target');
  renderAll();
  toast('모두 지웠어요');
};

function renderAll() {
  renderTrack();
  renderNext();
  renderTowns();
  renderRecords();
}
renderAll();
</script>
</body>
</html>
