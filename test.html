<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>혼밥 레벨 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="card" id="box"></section>
  <section class="card" id="table" hidden></section>
</main>

<script src="common.js"></script>
<script>
renderNav('test.html');

let idx = 0;
let ans = new Array(10).fill(false);

// ---------- 문항 화면 ----------
function showQ() {
  $('table').hidden = true;
  const lv = idx + 1;
  const info = LEVELS[lv];
  const back = idx > 0
    ? '<button class="q-back" id="back">\u{2039} 이전</button>'
    : '';
  $('box').innerHTML =
    '<div class="q-top">' + back +
    '<span class="q-count">' + lv + ' / 9</span></div>' +
    '<div class="bar"><i style="width:' + (lv / 9 * 100) + '%"></i></div>' +
    '<div class="q-body">' +
    '<div class="emo emo-big">' + info.emoji + '</div>' +
    '<p class="q-label">Lv.' + lv + ' ' + info.label + '</p>' +
    '<p class="q-text">' + info.q + '</p></div>' +
    '<button class="btn btn-primary" id="yes">있어요</button>' +
    '<button class="btn btn-gray" id="no">없어요</button>';
  $('yes').onclick = () => answer(true);
  $('no').onclick = () => answer(false);
  if ($('back')) {
    $('back').onclick = () => {
      idx--;
      showQ();
    };
  }
}

// 9문항 모두 진행 (조기 종료 없음)
function answer(v) {
  ans[idx + 1] = v;
  idx++;
  if (idx < 9) {
    showQ();
  } else {
    store.set('tried', ans);
    store.del('target');
    showResult();
  }
}

// ---------- 결과 화면 ----------
function showResult() {
  const lv = myLevel();
  const nx = nextLevel();
  const t = getTried();

  let next;
  if (lv === 0) {
    next = '첫 도전은 <b>' + LEVELS[1].emoji + ' ' + lvTitle(1) +
      '</b>부터 시작해요';
  } else if (nx) {
    next = '<p class="sub">다음 도전</p><b>' + LEVELS[nx].emoji + ' ' +
      lvTitle(nx) + '</b><p class="sub">' + LEVELS[nx].label +
      '에서 혼밥해 보세요</p>';
  } else {
    next = '모든 레벨을 해 봤어요! 진정한 혼밥 마스터 \u{1F451}';
  }

  $('box').innerHTML =
    '<div class="q-body" style="padding-bottom:8px">' +
    '<div class="emo emo-big">' + LEVELS[lv].emoji + '</div>' +
    '<p class="q-label">내 혼밥 레벨은</p>' +
    '<p class="big">' + lvTitle(lv) + '</p></div>' +
    '<div class="gray-box" style="text-align:center">' + next + '</div>' +
    '<a class="btn btn-primary" href="index.html">' +
    '내 주변에서 도전할 곳 찾기</a>' +
    '<button class="btn btn-gray" id="again">다시 하기</button>';
  $('again').onclick = restart;

  let rows = '';
  for (let i = 1; i <= 9; i++) {
    rows +=
      '<li class="item static"><div class="emo">' + LEVELS[i].emoji +
      '</div><div class="item-main"><div class="item-name">' +
      lvTitle(i) + '</div><div class="sub">' + LEVELS[i].label +
      '</div></div><div class="item-dist">' +
      (t[i] ? '\u{2705}' : '') + '</div></li>';
  }
  $('table').innerHTML =
    '<div class="card-title">혼밥 레벨 기준표</div>' +
    '<ul class="list">' + rows + '</ul>';
  $('table').hidden = false;
}

function restart() {
  idx = 0;
  ans = new Array(10).fill(false);
  showQ();
  window.scrollTo(0, 0);
}

// ---------- 시작 ----------
if (hasTested()) showResult();
else showQ();
</script>
</body>
</html>
